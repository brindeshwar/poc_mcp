[project]
name = "listenloom-meeting-hub"
version = "0.2.0"
description = "MCP server that stores meeting transcripts, answers questions about them, and pushes action items to Jira"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "google-genai>=1.30,<3",
    "pymongo>=4.13,<5",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "httpx>=0.28,<1",
    "streamlit>=1.47,<2",
]

[project.scripts]
meeting-hub = "meeting_hub.server:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`; long prompt strings are fine

[tool.ruff.lint.isort]
known-first-party = ["meeting_hub"]
known-third-party = ["mcp"]
